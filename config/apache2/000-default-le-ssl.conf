<IfModule mod_ssl.c>

<VirtualHost *:80>
  ServerName YOURFQDN.example.com
  RedirectMatch 301 /(.*) https://YOURFQDN.example.com/jhub/
</VirtualHost>

<VirtualHost *:443>
	ServerAdmin webmaster@localhost
	DocumentRoot /var/www/html

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

ServerName YOURFQDN.example.com
SSLCertificateFile /etc/letsencrypt/live/YOURFQDN.example.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/YOURFQDN.example.com/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf

  RedirectMatch 301 / https://YOURFQDN.example.com/jhub/

ProxyRequests Off
  RewriteEngine On
  RewriteCond %{HTTP:Connection} Upgrade [NC]
  RewriteCond %{HTTP:Upgrade} websocket [NC]

 RewriteRule /jhub/(.*) ws://127.0.0.1:8000/jhub/$1 [P,L]
 RewriteRule /jhub/(.*) http://127.0.0.1:8000/jhub/$1 [P,L]

    ProxyPreserveHost on
    RequestHeader set X-Forwarded-Proto: "https"

<Location "/jhub/">
    # preserve Host header to avoid cross-origin problems
     ProxyPass         http://127.0.0.1:8000/jhub/
     ProxyPassReverse  http://127.0.0.1:8000/jhub/
</Location>
 
</VirtualHost>

</IfModule>
