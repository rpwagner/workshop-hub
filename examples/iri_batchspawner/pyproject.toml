[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iri-batchspawner-prototype"
version = "0.0.0"
description = "Example IRI scheduler backend for JupyterHub BatchSpawner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "amsc-iri==1.2.0",
    "batchspawner==1.3.0",
    "jupyterhub>=5,<6",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
example = ["oauthenticator>=17.4,<18"]
test = ["oauthenticator>=17.4,<18", "pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[project.scripts]
iri-batchspawner-singleuser = "iri_batchspawner.singleuser:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
